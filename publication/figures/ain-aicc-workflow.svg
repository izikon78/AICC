   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202020" x="231.777" y="61.395623" transform="rotate(-0 231.777 61.395623)">Learned agent</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202020" transform="translate(175.070672 74.78915)">fluent AIN representation</text>
